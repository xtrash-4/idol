apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace "com.mpruyy.idolchat"

    defaultConfig {
        applicationId "com.mpruyy.idolchat"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
