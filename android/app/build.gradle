plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mpruyy.idolchat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mpruyy.idolchat'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
